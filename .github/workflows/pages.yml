name: Pages

# Static demo at https://mikekuss.github.io/lazy-ease/: pre-rendered variants
# behind a custom loader, see apps/demo/scripts/build-static.ts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The demo photos (scripts/generate-images.ts), so a deploy needs no
      # download. Saved only when every scene is a photo: a set with drawn
      # stand-ins is never cached, so the next deploy downloads again.
      - id: images
        uses: actions/cache/restore@v4
        with:
          path: apps/demo/images
          key: demo-images-${{ hashFiles('apps/demo/scripts/generate-images.ts') }}
      - run: pnpm --filter demo build:static
      - id: complete
        run: echo "photos=$(node -e "const s=require('./apps/demo/images/.sources.json');console.log(Object.values(s).every((v)=>v.startsWith('photo:')))")" >> "$GITHUB_OUTPUT"
      - if: steps.images.outputs.cache-hit != 'true' && steps.complete.outputs.photos == 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/demo/images
          key: demo-images-${{ hashFiles('apps/demo/scripts/generate-images.ts') }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
