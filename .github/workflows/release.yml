name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed, then creates the
# GitHub Release for the tag from CHANGELOG.md, with the conformance fixtures
# and release.json as assets. Steps and the one-time npm setup are in
# RELEASING.md.
#
# npm Trusted Publishing (OIDC): no NPM_TOKEN secret. npm trusts this workflow
# file (release.yml) in mikekuss/lazy-ease, configured per package on
# npmjs.com, and attaches provenance.
#
# Running it by hand (workflow_dispatch) is a dry run: everything up to
# `pnpm publish --dry-run`, no upload, no GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Every package under packages/ is published, in lockstep (one version) and in
# dependency order: scripts/release-check.mjs checks both and lists the
# packages. A package must exist on npm with this workflow as its Trusted
# Publisher before a tag can publish it; the first version of a new package is
# published by hand (RELEASING.md).

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # Trusted Publishing needs a GitHub-hosted runner
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # pnpm publish hands the tarball to the npm CLI, which does the OIDC
      # exchange. Trusted Publishing needs npm 11.5.1 or later.
      - name: npm CLI for Trusted Publishing
        run: |
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install -g npm@11
          fi
          npm --version

      # Lockstep versions, workspace ranges, tag and changelog. Writes tag,
      # version, prerelease and packages (in publication order) to the outputs.
      - name: Check tag, package versions and changelog
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node scripts/release-check.mjs --tag "$GITHUB_REF_NAME"
          else
            tag="v$(node -p 'require("./packages/core/package.json").version')"
            echo "::notice::Not a tag push: dry run for $tag"
            node scripts/release-check.mjs --tag "$tag" --dry-run
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # pnpm pack applies publishConfig and packs workspace:* as the exact
      # version (npm pack would keep the `source` export). Fails on a `source`
      # condition, a missing export target or a dependency at another version.
      - name: Pack and check
        env:
          PACKAGES: ${{ steps.version.outputs.packages }}
        run: |
          # shellcheck disable=SC2086 # PACKAGES is a space-separated list
          node scripts/pack.mjs "$RUNNER_TEMP/pack" $PACKAGES

      # Fails before uploading anything if a package isn't on npm yet (Trusted
      # Publishing can't create one; RELEASING.md has the first publish by
      # hand) or if a version already on npm has other files than the tarball
      # packed here. Matching versions are marked for the Publish step to skip,
      # and release.json takes npm's integrity for them.
      - name: Compare with npm
        env:
          DRY_RUN: ${{ github.event_name != 'push' }}
        run: |
          flags=()
          [ "$DRY_RUN" = true ] && flags+=(--dry-run)
          node scripts/check-published.mjs "$RUNNER_TEMP/pack" "${flags[@]}"

      # The GitHub Release assets: the conformance fixtures, byte for byte from
      # the packed @lazy-ease/testing, and release.json (every tarball with its
      # integrity and files).
      - name: Release assets
        run: |
          node scripts/fixture-assets.mjs "$RUNNER_TEMP/assets" "$RUNNER_TEMP"/pack/lazy-ease-testing-*.tgz
          cp "$RUNNER_TEMP/pack/release.json" "$RUNNER_TEMP/assets/"
          ls -l "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      # The tarballs themselves, so a first version published by hand
      # (RELEASING.md) can be exactly the bytes this workflow checks.
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # The tag on GitHub must still name the commit this run checked and packed:
      # a tag moved after the push would give npm and the release other code.
      - name: Check that the tag still points at this commit
        if: github.event_name == 'push'
        run: |
          # An annotated tag lists its commit as the peeled ref (^{}), last.
          remote=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}" | tail -n 1 | cut -f 1)
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME points at ${remote:-nothing} on GitHub, not at $GITHUB_SHA, which this run checked"
            exit 1
          fi

      # Publishes the tarballs checked above, dependencies first (packed.json
      # is in publication order). Versions that are already on npm with the
      # same files are skipped, so a failed run can be re-run.
      - name: Publish
        id: publish
        env:
          DRY_RUN: ${{ github.event_name != 'push' }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=(--access public --provenance --no-git-checks)
          [ "$PRERELEASE" = true ] && args+=(--tag next)
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          published=()
          while IFS=$'\t' read -r name version tarball skip; do
            if [ "$skip" = true ]; then
              echo "::notice::$name@$version is already on npm with the same files, skipping"
            else
              pnpm publish "$tarball" "${args[@]}"
            fi
            published+=("$name")
          done < <(node -e '
            for (const p of require(process.argv[1])) console.log([p.name, p.version, p.tarball, !!p.published].join("\t"));
          ' "$RUNNER_TEMP/pack/packed.json")
          echo "published=${published[*]}" >> "$GITHUB_OUTPUT"

  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      # The tag on GitHub must still name the commit this run checked and packed:
      # a tag moved after the push would give npm and the release other code.
      - name: Check that the tag still points at this commit
        if: github.event_name == 'push'
        run: |
          # An annotated tag lists its commit as the peeled ref (^{}), last.
          remote=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}" | tail -n 1 | cut -f 1)
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME points at ${remote:-nothing} on GitHub, not at $GITHUB_SHA, which this run checked"
            exit 1
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          VERSION: ${{ needs.publish.outputs.version }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run. Upload only assets the release lacks; one that differs
            # from this run means the tag or npm changed, so stop.
            mkdir "$RUNNER_TEMP/existing"
            # No asset yet is no match, not an error.
            gh release download "$TAG" --pattern '*.json' --dir "$RUNNER_TEMP/existing" || true
            upload=()
            for file in "$RUNNER_TEMP"/assets/*.json; do
              old="$RUNNER_TEMP/existing/$(basename "$file")"
              if [ ! -f "$old" ]; then
                upload+=("$file")
              elif ! cmp -s "$file" "$old"; then
                echo "::error::The release for $TAG already has a different $(basename "$file")"
                exit 1
              fi
            done
            echo "::notice::A release for $TAG already exists, uploading ${#upload[@]} missing assets"
            [ "${#upload[@]}" -eq 0 ] || gh release upload "$TAG" "${upload[@]}"
            # A run that failed while uploading can leave the release a draft.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$TAG" --draft=false
            fi
            exit 0
          fi
          # shellcheck disable=SC2086 # PUBLISHED is a space-separated list
          node scripts/release-notes.mjs "$VERSION" $PUBLISHED > "$RUNNER_TEMP/notes.md"
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --title "lazy-ease $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" "$RUNNER_TEMP"/assets/*.json
