name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed, then creates the
# GitHub Release for the tag from CHANGELOG.md, with the conformance fixtures
# and release.json as assets. Steps and the one-time npm setup are in
# RELEASING.md.
#
# npm Trusted Publishing (OIDC): no NPM_TOKEN secret. npm trusts this workflow
# file (release.yml) in mikekuss/lazy-ease, configured per package on
# npmjs.com, and attaches provenance.
#
# Running it by hand (workflow_dispatch) is a dry run: everything up to
# `pnpm publish --dry-run`, no upload, no GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Every package under packages/ is published, in lockstep (one version) and in
# dependency order: scripts/release-check.mjs checks both and lists the
# packages. A package must exist on npm with this workflow as its Trusted
# Publisher before a tag can publish it; the first version of a new package is
# published by hand (RELEASING.md).

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # Trusted Publishing needs a GitHub-hosted runner
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # pnpm publish hands the tarball to the npm CLI, which does the OIDC
      # exchange. Trusted Publishing needs npm 11.5.1 or later.
      - name: npm CLI for Trusted Publishing
        run: |
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install -g npm@11
          fi
          npm --version

      # Lockstep versions, workspace ranges, tag and changelog. Writes tag,
      # version, prerelease and packages (in publication order) to the outputs.
      - name: Check tag, package versions and changelog
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node scripts/release-check.mjs --tag "$GITHUB_REF_NAME"
          else
            tag="v$(node -p 'require("./packages/core/package.json").version')"
            echo "::notice::Not a tag push: dry run for $tag"
            node scripts/release-check.mjs --tag "$tag" --dry-run
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # pnpm pack applies publishConfig and packs workspace:* as the exact
      # version (npm pack would keep the `source` export). Fails on a `source`
      # condition, a missing export target or a dependency at another version.
      - name: Pack and check
        env:
          PACKAGES: ${{ steps.version.outputs.packages }}
        run: |
          # shellcheck disable=SC2086 # PACKAGES is a space-separated list
          node scripts/pack.mjs "$RUNNER_TEMP/pack" $PACKAGES

      # The GitHub Release assets: the conformance fixtures, byte for byte from
      # the packed @lazy-ease/testing, and release.json (every tarball with its
      # integrity and files).
      - name: Release assets
        run: |
          node scripts/fixture-assets.mjs "$RUNNER_TEMP/assets" "$RUNNER_TEMP"/pack/lazy-ease-testing-*.tgz
          cp "$RUNNER_TEMP/pack/release.json" "$RUNNER_TEMP/assets/"
          ls -l "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # Trusted Publishing can't create a package. Fail before uploading
      # anything if one of them isn't on npm yet; RELEASING.md has the first
      # publish by hand.
      - name: Check that every package exists on npm
        env:
          DRY_RUN: ${{ github.event_name != 'push' }}
        run: |
          missing=()
          while IFS=$'\t' read -r name; do
            npm view "$name" name > /dev/null 2>&1 || missing+=("$name")
          done < <(node -e 'for (const p of require(process.argv[1])) console.log(p.name)' "$RUNNER_TEMP/pack/packed.json")
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::Not on npm yet, a tag push would fail here (RELEASING.md): ${missing[*]}"
            else
              echo "::error::Not on npm yet, publish the first version by hand (RELEASING.md): ${missing[*]}"
              exit 1
            fi
          fi

      # Publishes the tarballs checked above, dependencies first (packed.json
      # is in publication order). A version that is already on npm is skipped,
      # so a failed run can be re-run. If its integrity on npm differs from the
      # tarball packed here (a version published by hand on another machine:
      # gzip headers differ between systems), it warns, because release.json
      # describes the tarball packed here.
      - name: Publish
        id: publish
        env:
          DRY_RUN: ${{ github.event_name != 'push' }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=(--access public --provenance --no-git-checks)
          [ "$PRERELEASE" = true ] && args+=(--tag next)
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          published=()
          while IFS=$'\t' read -r name version tarball integrity; do
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "::notice::$name@$version is already on npm, skipping"
              remote="$(npm view "$name@$version" dist.integrity 2>/dev/null)"
              if [ "$remote" != "$integrity" ]; then
                echo "::warning::$name@$version on npm has integrity ${remote:-(none)}, release.json has $integrity (the tarball packed here; RELEASING.md)"
              fi
            else
              pnpm publish "$tarball" "${args[@]}"
            fi
            published+=("$name")
          done < <(node -e '
            for (const p of require(process.argv[1])) console.log([p.name, p.version, p.tarball, p.integrity].join("\t"));
          ' "$RUNNER_TEMP/pack/packed.json")
          echo "published=${published[*]}" >> "$GITHUB_OUTPUT"

  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          VERSION: ${{ needs.publish.outputs.version }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run: the assets come from the same commit, so replacing them changes nothing.
            echo "::notice::A release for $TAG already exists, only uploading its assets"
            gh release upload "$TAG" "$RUNNER_TEMP"/assets/*.json --clobber
            exit 0
          fi
          # shellcheck disable=SC2086 # PUBLISHED is a space-separated list
          node scripts/release-notes.mjs "$VERSION" $PUBLISHED > "$RUNNER_TEMP/notes.md"
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --title "lazy-ease $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" "$RUNNER_TEMP"/assets/*.json
