name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed, then creates the
# GitHub Release for the tag from CHANGELOG.md. Steps and the one-time npm
# setup are in RELEASING.md.
#
# npm Trusted Publishing (OIDC): no NPM_TOKEN secret. npm trusts this workflow
# file (release.yml) in mikekuss/lazy-ease, configured per package on
# npmjs.com, and attaches provenance.
#
# Running it by hand (workflow_dispatch) is a dry run: everything up to
# `pnpm publish --dry-run`, no upload, no GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Packages to publish, as workspace directories separated by spaces.
#
# @lazy-ease/server is left out on purpose until it should go to npm. To
# publish it, add packages/server here and add mikekuss/lazy-ease with
# release.yml as Trusted Publisher for @lazy-ease/server on npmjs.com (the
# package has to exist first, see RELEASING.md).
env:
  PACKAGES: packages/react

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # Trusted Publishing needs a GitHub-hosted runner
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # pnpm publish hands the tarball to the npm CLI, which does the OIDC
      # exchange. Trusted Publishing needs npm 11.5.1 or later.
      - name: npm CLI for Trusted Publishing
        run: |
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install -g npm@11
          fi
          npm --version

      - name: Check tag, package versions and changelog
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p 'require("./packages/react/package.json").version')"
            echo "::notice::Not a tag push: dry run for $tag"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $tag is not a version tag like v1.2.3"
            exit 1
          fi
          version="${tag#v}"
          for dir in $PACKAGES; do
            actual="$(node -p "require('./$dir/package.json').version")"
            if [ "$actual" != "$version" ]; then
              echo "::error file=$dir/package.json::$dir is at $actual, the tag is $tag"
              exit 1
            fi
          done
          node scripts/release-notes.mjs "$version" > /dev/null
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # pnpm pack applies publishConfig (npm pack would keep the `source`
      # export). Fails on a `source` condition, missing files, publint or attw.
      - name: Pack and check
        run: node scripts/pack.mjs "$RUNNER_TEMP/pack" $PACKAGES

      # Publishes the tarballs checked above. A version that is already on
      # npm is skipped, so a failed run can be re-run.
      - name: Publish
        id: publish
        env:
          DRY_RUN: ${{ github.event_name != 'push' }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=(--access public --provenance --no-git-checks)
          [ "$PRERELEASE" = true ] && args+=(--tag next)
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          published=()
          while IFS=$'\t' read -r name version tarball; do
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "::notice::$name@$version is already on npm, skipping"
            else
              pnpm publish "$tarball" "${args[@]}"
            fi
            published+=("$name")
          done < <(node -e '
            for (const p of require(process.argv[1])) console.log([p.name, p.version, p.tarball].join("\t"));
          ' "$RUNNER_TEMP/pack/packed.json")
          echo "published=${published[*]}" >> "$GITHUB_OUTPUT"

  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          VERSION: ${{ needs.publish.outputs.version }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::A release for $TAG already exists, leaving it alone"
            exit 0
          fi
          # shellcheck disable=SC2086 # PUBLISHED is a space-separated list
          node scripts/release-notes.mjs "$VERSION" $PUBLISHED > "$RUNNER_TEMP/notes.md"
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --title "lazy-ease $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
