<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fade hero · lazy-ease</title>
    <!--le:site-->
    <link rel="stylesheet" href="/src/fade/fade.css" />
  </head>
  <body>
    <!--le:nav-->
    <form class="bar" id="settings">
      <strong>Fade hero</strong>
      <label>Network
        <select name="net">
          <option value="off">Real speed</option>
          <option value="fast-4g">Fast 4G</option>
          <option value="slow-4g">Slow 4G</option>
          <option value="3g">3G</option>
        </select>
      </label>
      <label>Start script
        <select name="late">
          <option value="0">At once</option>
          <option value="1000">After 1 s</option>
          <option value="3000">After 3 s</option>
        </select>
      </label>
      <button type="submit" class="primary">Reload</button>
      <output id="status" class="stat" aria-live="polite">Script waiting</output>
    </form>
    <main class="page">
      <p class="note warn" id="throttle-note" hidden>Throttle starts on the next reload.</p>
      <section class="case">
        <h2>Hero <small>Color placeholder, then one fade. Wide crop from 800 px.</small></h2>
        <code class="props">&lt;span data-le data-hero&gt; &lt;picture&gt; … data-le-srcset data-le-sizes</code>
        <section data-le-auto class="hero-area shot">
          <!--le:hero-fade-->
        </section>
      </section>
      <section class="case">
        <h2>Native and JS <small>Same template, three modes. The native image shows before the script and stays.</small></h2>
        <section data-le-auto class="pair">
          <!--le:pair-->
        </section>
      </section>
    </main>
    <script type="module" src="/src/fade/main.ts"></script>
  </body>
</html>
